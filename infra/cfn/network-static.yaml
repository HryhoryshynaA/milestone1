AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  KV capstone M1 - STATIC network stack (VPC, public+private subnets, IGW, routing, NACLs,
  internal SG, S3 gateway endpoint, optional NAT). Rarely changes; apply by hand (ADR-0002).

# --------------------------------------------------------------------------------------
# Parameters: custom values at create/update time (lecture: "Parameters")
# --------------------------------------------------------------------------------------
Parameters:
  ProjectName:
    Type: String
    Default: kv
    AllowedPattern: "^[a-z][a-z0-9-]{1,15}$"
    Description: Lower-case, hyphenated prefix used in every resource name (naming convention).
  EnvironmentName:
    Type: String
    Default: qa
    AllowedValues: [qa, prod]
  VpcCidr:
    Type: String
    Default: 10.42.0.0/16
    AllowedPattern: "^(\\d{1,3}\\.){3}\\d{1,3}/16$"
    Description: >-
      Must be a /16 (subnet bands in ADR-0003 assume it). Do NOT use 10.0.0.0/16 (console default)
      or 172.31.0.0/16 (default VPC) - overlapping ranges block future peering/merges.
  EnableNatGateway:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >-
      false = private subnets are internal-only (spec default). true = adds ~36.50 USD/month
      (NAT hourly + its public IPv4) plus 0.045 USD/GB. See docs/m1/07-budget.md.

# --------------------------------------------------------------------------------------
# Conditions (lecture: "Conditions")
# --------------------------------------------------------------------------------------
Conditions:
  CreateNat: !Equals [!Ref EnableNatGateway, "true"]

Resources:
  # ---------------------------------------------------------------- VPC + Internet Gateway
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - { Key: Name, Value: !Sub "${ProjectName}-${EnvironmentName}-vpc" }
        - { Key: Project, Value: !Ref ProjectName }
        - { Key: Environment, Value: !Ref EnvironmentName }

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - { Key: Name, Value: !Sub "${ProjectName}-${EnvironmentName}-igw" }

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  # ---------------------------------------------------------------- Subnets (ADR-0003 bands)
  # Fn::Cidr [block, count, hostBits]: 64 x /24 slices of the /16. Index = third octet.
  #   public  tier: indexes 0,1    -> 10.42.0.0/24, 10.42.1.0/24
  #   private tier: indexes 16,17  -> 10.42.16.0/24, 10.42.17.0/24
  #   data    tier: indexes 32,33  -> RESERVED for M2, intentionally not created
  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: !Select [0, !Cidr [!GetAtt Vpc.CidrBlock, 64, 8]]
      MapPublicIpOnLaunch: false
      Tags:
        - { Key: Name, Value: !Sub "${ProjectName}-${EnvironmentName}-public-a" }
        - { Key: Tier, Value: public }

  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: !Select [1, !Cidr [!GetAtt Vpc.CidrBlock, 64, 8]]
      MapPublicIpOnLaunch: false
      Tags:
        - { Key: Name, Value: !Sub "${ProjectName}-${EnvironmentName}-public-b" }
        - { Key: Tier, Value: public }

  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: !Select [16, !Cidr [!GetAtt Vpc.CidrBlock, 64, 8]]
      MapPublicIpOnLaunch: false
      Tags:
        - { Key: Name, Value: !Sub "${ProjectName}-${EnvironmentName}-private-a" }
        - { Key: Tier, Value: private }

  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: !Select [17, !Cidr [!GetAtt Vpc.CidrBlock, 64, 8]]
      MapPublicIpOnLaunch: false
      Tags:
        - { Key: Name, Value: !Sub "${ProjectName}-${EnvironmentName}-private-b" }
        - { Key: Tier, Value: private }

  # ---------------------------------------------------------------- Routing
  # A subnet is "public" ONLY because its route table points 0.0.0.0/0 at the IGW,
  # not because of its name.
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - { Key: Name, Value: !Sub "${ProjectName}-${EnvironmentName}-public-rt" }

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment   # lecture: DependsOn - IGW must be attached first
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetARouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref PublicSubnetA, RouteTableId: !Ref PublicRouteTable }

  PublicSubnetBRouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref PublicSubnetB, RouteTableId: !Ref PublicRouteTable }

  # Private route table has only the implicit "local" route unless NAT is enabled.
  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - { Key: Name, Value: !Sub "${ProjectName}-${EnvironmentName}-private-rt" }

  PrivateSubnetARouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref PrivateSubnetA, RouteTableId: !Ref PrivateRouteTable }

  PrivateSubnetBRouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref PrivateSubnetB, RouteTableId: !Ref PrivateRouteTable }

  # ---------------------------------------------------------------- Optional NAT (off by default)
  NatEip:
    Type: AWS::EC2::EIP
    Condition: CreateNat
    DependsOn: InternetGatewayAttachment
    Properties:
      Domain: vpc
      Tags:
        - { Key: Name, Value: !Sub "${ProjectName}-${EnvironmentName}-nat-eip" }

  NatGateway:
    Type: AWS::EC2::NatGateway
    Condition: CreateNat
    Properties:
      AllocationId: !GetAtt NatEip.AllocationId
      SubnetId: !Ref PublicSubnetA          # NAT must live in a PUBLIC subnet
      Tags:
        - { Key: Name, Value: !Sub "${ProjectName}-${EnvironmentName}-nat" }

  PrivateDefaultRoute:
    Type: AWS::EC2::Route
    Condition: CreateNat
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway

  # ---------------------------------------------------------------- Free S3 gateway endpoint
  S3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      VpcEndpointType: Gateway
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.s3"
      RouteTableIds: [!Ref PrivateRouteTable]

  # ---------------------------------------------------------------- Network ACLs (stateless, subnet level)
  PublicNacl:
    Type: AWS::EC2::NetworkAcl
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - { Key: Name, Value: !Sub "${ProjectName}-${EnvironmentName}-public-nacl" }

  PublicNaclInHttps:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref PublicNacl
      RuleNumber: 100
      Protocol: 6
      RuleAction: allow
      Egress: false
      CidrBlock: 0.0.0.0/0
      PortRange: { From: 443, To: 443 }

  PublicNaclInHttp:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref PublicNacl
      RuleNumber: 110
      Protocol: 6
      RuleAction: allow
      Egress: false
      CidrBlock: 0.0.0.0/0
      PortRange: { From: 80, To: 80 }

  PublicNaclInEphemeral:        # stateless => return traffic must be allowed explicitly
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref PublicNacl
      RuleNumber: 120
      Protocol: 6
      RuleAction: allow
      Egress: false
      CidrBlock: 0.0.0.0/0
      PortRange: { From: 1024, To: 65535 }

  PublicNaclInVpc:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref PublicNacl
      RuleNumber: 130
      Protocol: -1
      RuleAction: allow
      Egress: false
      CidrBlock: !Ref VpcCidr

  PublicNaclOutAll:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref PublicNacl
      RuleNumber: 100
      Protocol: -1
      RuleAction: allow
      Egress: true
      CidrBlock: 0.0.0.0/0

  PublicSubnetANaclAssociation:
    Type: AWS::EC2::SubnetNetworkAclAssociation
    Properties: { SubnetId: !Ref PublicSubnetA, NetworkAclId: !Ref PublicNacl }

  PublicSubnetBNaclAssociation:
    Type: AWS::EC2::SubnetNetworkAclAssociation
    Properties: { SubnetId: !Ref PublicSubnetB, NetworkAclId: !Ref PublicNacl }

  PrivateNacl:
    Type: AWS::EC2::NetworkAcl
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - { Key: Name, Value: !Sub "${ProjectName}-${EnvironmentName}-private-nacl" }

  PrivateNaclInVpc:             # internal access only: the VPC itself may talk to us
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref PrivateNacl
      RuleNumber: 100
      Protocol: -1
      RuleAction: allow
      Egress: false
      CidrBlock: !Ref VpcCidr

  PrivateNaclInEphemeral:       # return traffic from S3 endpoint / NAT; SGs remain the tight layer
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref PrivateNacl
      RuleNumber: 110
      Protocol: 6
      RuleAction: allow
      Egress: false
      CidrBlock: 0.0.0.0/0
      PortRange: { From: 1024, To: 65535 }

  PrivateNaclOutAll:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref PrivateNacl
      RuleNumber: 100
      Protocol: -1
      RuleAction: allow
      Egress: true
      CidrBlock: 0.0.0.0/0

  PrivateSubnetANaclAssociation:
    Type: AWS::EC2::SubnetNetworkAclAssociation
    Properties: { SubnetId: !Ref PrivateSubnetA, NetworkAclId: !Ref PrivateNacl }

  PrivateSubnetBNaclAssociation:
    Type: AWS::EC2::SubnetNetworkAclAssociation
    Properties: { SubnetId: !Ref PrivateSubnetB, NetworkAclId: !Ref PrivateNacl }

  # ---------------------------------------------------------------- Security group (stateful, instance level)
  # Members of this SG may talk to each other and to nobody else (SG referencing itself),
  # instead of the "allow all from the subnet CIDR" shortcut.
  InternalSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: KV internal members - self-referencing, no inbound from outside
      VpcId: !Ref Vpc
      Tags:
        - { Key: Name, Value: !Sub "${ProjectName}-${EnvironmentName}-internal-sg" }

  InternalSecurityGroupSelfIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref InternalSecurityGroup
      IpProtocol: "-1"
      SourceSecurityGroupId: !Ref InternalSecurityGroup
      Description: Members of this SG may talk to each other

# --------------------------------------------------------------------------------------
# Outputs are exported so M2 (a *dynamic* stack) can reference the network (ADR-0002)
# --------------------------------------------------------------------------------------
Outputs:
  VpcId:
    Value: !Ref Vpc
    Export: { Name: !Sub "${AWS::StackName}-VpcId" }
  VpcCidr:
    Value: !GetAtt Vpc.CidrBlock
    Export: { Name: !Sub "${AWS::StackName}-VpcCidr" }
  PublicSubnetIds:
    Value: !Join [",", [!Ref PublicSubnetA, !Ref PublicSubnetB]]
    Export: { Name: !Sub "${AWS::StackName}-PublicSubnetIds" }
  PrivateSubnetIds:
    Value: !Join [",", [!Ref PrivateSubnetA, !Ref PrivateSubnetB]]
    Export: { Name: !Sub "${AWS::StackName}-PrivateSubnetIds" }
  PrivateRouteTableId:
    Value: !Ref PrivateRouteTable
    Export: { Name: !Sub "${AWS::StackName}-PrivateRouteTableId" }
  InternalSecurityGroupId:
    Value: !Ref InternalSecurityGroup
    Export: { Name: !Sub "${AWS::StackName}-InternalSgId" }
